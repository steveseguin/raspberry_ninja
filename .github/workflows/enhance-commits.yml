name: Enhance Commit Messages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: enhance-commits-${{ github.ref }}
  cancel-in-progress: true

jobs:
  enhance-commits:
    if: "!contains(github.event.head_commit.message, '[auto-enhanced]') && github.actor != 'github-actions[bot]'"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 5
          token: ${{ github.token }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install enhancer dependency
        run: npm install --prefix "$RUNNER_TEMP/enhancer" --no-audit --no-fund --ignore-scripts axios
      - name: Configure Git
        run: |
          git config user.name "GitHub Actions Commit Enhancer"
          git config user.email "actions@github.com"
      - name: Enhance commit message
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY || secrets.ZEN_API_TOKEN }}
          NODE_PATH: ${{ runner.temp }}/enhancer/node_modules
        run: node .github/scripts/enhance-commits.js
