name: Auto Release

on:
  workflow_run:
    workflows: ["Test Suite"]
    types: [completed]

concurrency:
  group: auto-release-main
  cancel-in-progress: false

jobs:
  check-and-release:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check whether this commit needs a release
        id: release_changes
        shell: bash
        run: |
          if [ "$(git rev-parse HEAD)" != "${{ github.event.workflow_run.head_sha }}" ]; then
            echo "A newer main commit exists; its test run will handle the release."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff-tree --no-commit-id --name-only -r HEAD > /tmp/changed-files
          cat /tmp/changed-files
          if grep -Eq '^(publish\.py|install\.sh|tools/(install_unattended|setup)\.py|installers/.+/(installer\.sh|[^/]+\.service)|raspberry_pi/installer\.sh|nvidia_jetson/installer\.sh|orangepi/installer\.sh|ubuntu/installer\.sh|.+\.service|raspberry_pi/Cargo\.toml)$' /tmp/changed-files; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        if: steps.release_changes.outputs.should_release == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Configure Git
        if: steps.release_changes.outputs.should_release == 'true'
        run: |
          git config --global user.name "GitHub Actions Release Bot"
          git config --global user.email "actions@github.com"

      - name: Install GitHub CLI
        if: steps.release_changes.outputs.should_release == 'true'
        run: |
          type gh >/dev/null 2>&1 || (
            curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo gpg --dearmor -o /usr/share/keyrings/githubcli-archive-keyring.gpg
            echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list >/dev/null
            sudo apt-get update
            sudo apt-get install gh -y
          )

      - name: Create release
        if: steps.release_changes.outputs.should_release == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/auto-release.js
