name: Test Suite

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compatibility:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Bullseye / Python 3.9 / GStreamer 1.18
            image: debian:bullseye
          - name: Bookworm / Python 3.11 / GStreamer 1.22
            image: debian:bookworm
          - name: Trixie / Python 3.13 / GStreamer 1.26
            image: debian:trixie

    steps:
      - uses: actions/checkout@v4

      - name: Install runtime dependencies
        shell: bash
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates \
            python3 \
            python3-aiohttp \
            python3-cryptography \
            python3-gi \
            python3-websockets \
            gir1.2-gstreamer-1.0 \
            gir1.2-gst-plugins-base-1.0 \
            gir1.2-gst-plugins-bad-1.0 \
            gstreamer1.0-libav \
            gstreamer1.0-nice \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-ugly \
            gstreamer1.0-tools

      - name: Record compatibility environment
        shell: bash
        run: |
          cat /etc/os-release
          /usr/bin/python3 --version
          gst-launch-1.0 --version

      - name: Check Python syntax
        shell: bash
        run: |
          /usr/bin/python3 -m compileall -q \
            publish.py config_loader.py signaling_utils.py v4l2_devices.py \
            webrtc_subprocess_glib.py tools tests

      - name: Run complete test suite
        shell: bash
        run: /usr/bin/python3 -m unittest discover -s tests -v
