<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Raspberry Ninja HLS Player</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.6.19/dist/hls.min.js"></script>
    <style>
        body { font: 16px system-ui, sans-serif; max-width: 900px; margin: 24px auto; padding: 0 16px; color: #18212b; }
        h1 { font-size: 1.6rem; }
        form { display: flex; gap: 8px; flex-wrap: wrap; margin: 8px 0 16px; }
        input { flex: 1 1 300px; min-width: 0; padding: 12px; font: inherit; }
        button { padding: 12px 20px; font: inherit; cursor: pointer; }
        video { width: 100%; background: #111; max-height: 65vh; }
        #status { min-height: 1.5em; }
        #log { white-space: pre-wrap; overflow-wrap: anywhere; max-height: 240px; overflow: auto; font-size: .85rem; }
    </style>
</head>
<body>
    <h1>Raspberry Ninja HLS Player</h1>
    <p>Paste the full playlist URL from your recording server. Use the Pi's hostname or address when playing from another computer.</p>
    <label for="source">Playlist URL (.m3u8)</label>
    <form id="playerForm">
        <input id="source" type="url" placeholder="http://raspberrypi.local:8080/hls/recording.m3u8" required spellcheck="false" autocomplete="off">
        <button type="submit">Play</button>
        <button id="stop" type="button">Stop</button>
    </form>
    <p id="status" role="status" aria-live="polite">Enter a playlist URL, then choose Play.</p>
    <video id="video" controls playsinline></video>
    <details><summary>Playback log</summary><pre id="log"></pre></details>
    <script>
        'use strict';
        const video = document.getElementById('video');
        const source = document.getElementById('source');
        const statusEl = document.getElementById('status');
        const logEl = document.getElementById('log');
        let hls = null;
        let generation = 0;
        let active = false;
        const lines = [];

        function log(message) {
            lines.push(new Date().toLocaleTimeString() + ' — ' + message);
            if (lines.length > 100) lines.shift();
            logEl.textContent = lines.join('\n');
        }

        function stopPlayback() {
            generation++;
            active = false;
            if (hls) { hls.destroy(); hls = null; }
            video.pause();
            video.removeAttribute('src');
            video.load();
        }

        async function beginPlayback(current) {
            try { await video.play(); }
            catch (error) {
                if (current !== generation) return;
                statusEl.textContent = 'Use the video Play button to start playback.';
                log(error.message);
            }
        }

        document.getElementById('playerForm').addEventListener('submit', event => {
            event.preventDefault();
            let url;
            try {
                url = new URL(source.value.trim());
                if (!['http:', 'https:'].includes(url.protocol)) throw new Error('Use an HTTP or HTTPS playlist URL.');
                if (location.protocol === 'https:' && url.protocol === 'http:') {
                    throw new Error('This HTTPS page cannot load an HTTP stream. Open this player as a local file or use an HTTPS stream.');
                }
            } catch (error) {
                statusEl.textContent = error.message || 'Enter a complete playlist URL.';
                return;
            }
            stopPlayback();
            const current = generation;
            active = true;
            statusEl.textContent = 'Loading playlist…';
            log('Loading a new playlist.');
            // Prefer native HLS where available, including when the CDN is offline.
            if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = url.href;
                beginPlayback(current);
            } else if (window.Hls && Hls.isSupported()) {
                hls = new Hls({liveSyncDurationCount: 3});
                hls.on(Hls.Events.MANIFEST_PARSED, () => {
                    if (current === generation) beginPlayback(current);
                });
                hls.on(Hls.Events.ERROR, (_event, data) => {
                    if (current !== generation) return;
                    log(data.type + ': ' + data.details);
                    if (data.fatal) {
                        stopPlayback();
                        statusEl.textContent = data.type === Hls.ErrorTypes.NETWORK_ERROR
                            ? 'Could not load the stream. Check the playlist URL, server, and CORS access, then choose Play to retry.'
                            : 'Playback failed. Check that the recording has playable audio/video, then choose Play to retry.';
                    }
                });
                hls.loadSource(url.href);
                hls.attachMedia(video);
            } else {
                active = false;
                statusEl.textContent = window.Hls
                    ? 'This browser does not support HLS playback. Try a current browser or VLC.'
                    : 'The playback library could not load. Check your internet connection and reload this page, or open the playlist in VLC.';
            }
        });

        document.getElementById('stop').addEventListener('click', () => {
            stopPlayback();
            statusEl.textContent = 'Stopped.';
        });
        video.addEventListener('playing', () => { if (active) statusEl.textContent = 'Playing'; });
        video.addEventListener('waiting', () => { if (active) statusEl.textContent = 'Buffering…'; });
        video.addEventListener('ended', () => { if (active) statusEl.textContent = 'Playback finished.'; });
        video.addEventListener('error', () => {
            if (active) statusEl.textContent = 'Could not play the stream. Check the playlist URL and media format.';
        });
        // Prefill only; opening a shared link must not start network playback.
        source.value = new URLSearchParams(location.search).get('url') || '';
        window.addEventListener('pagehide', stopPlayback);
    </script>
</body>
</html>
